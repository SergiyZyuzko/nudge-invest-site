name: Build and deploy to GitHub Pages

# Every push to main rebuilds dist/ and publishes it. The build validates
# titles, descriptions and internal links first, so a broken page fails the
# deploy instead of shipping.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Until the custom domain's DNS is live, serve from the github.io project
      # URL. Set the repo variable SITE_BASE_URL=https://nudgeinvest.app (and the
      # custom domain in Settings → Pages) to switch: the build then emits CNAME
      # and root-absolute paths.
      - run: node build.mjs
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://sergiyzyuzko.github.io/nudge-invest-site' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
